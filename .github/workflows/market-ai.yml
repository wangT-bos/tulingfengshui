name: Market AI

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  market-ai:
    if: contains(github.event.comment.body, '@market-ai') && !github.event.issue.pull_request
    runs-on: ubuntu-latest

    steps:
      - name: Reply as market AI with MiniMax
        uses: actions/github-script@v9
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_GROUP_ID: ${{ secrets.MINIMAX_GROUP_ID }}
        with:
          script: |
            const issueTitle = context.payload.issue.title || "";
            const issueBody = context.payload.issue.body || "";
            const userComment = context.payload.comment.body || "";

            const prompt = `
            你是本项目的「市场部 AI」。

            请从真实用户、市场转化、文案表达、信任感、易懂性角度审查这个需求。

            回复结构：

            ## 市场部 AI 反馈

            ### 1. 用户是否看得懂
            ### 2. 这个需求的价值
            ### 3. 文案和表达建议
            ### 4. 可能的风险
            ### 5. 建议给开发 AI 的任务

            Issue 标题：
            ${issueTitle}

            Issue 内容：
            ${issueBody}

            用户评论：
            ${userComment}
            `;

            const groupId = process.env.MINIMAX_GROUP_ID;
            const url = `https://api.minimax.chat/v1/text/chatcompletion_v2?GroupId=${groupId}`;

            const response = await fetch(url, {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${process.env.MINIMAX_API_KEY}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                model: "abab6.5s-chat",
                messages: [
                  {
                    sender_type: "USER",
                    text: prompt
                  }
                ]
              })
            });

            if (!response.ok) {
              const errorText = await response.text();
              throw new Error(errorText);
            }

            const data = await response.json();

            const text =
              data?.reply ||
              data?.choices?.[0]?.message?.content ||
              data?.choices?.[0]?.text ||
              JSON.stringify(data, null, 2);

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: text
            });
